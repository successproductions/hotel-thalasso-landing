name: Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          timeout: 60s
          command_timeout: 20m
          script: |
            # Load Node.js via NVM
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH="$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node/ | tail -1)/bin:$PATH"
            source ~/.bashrc || true
            source ~/.profile || true

            echo "==> Node version: $(node -v)"
            echo "==> NPM version: $(npm -v)"

            # Go to project folder
            cd $HOME/htdocs/offer.dakhlaclub.com

            echo "==> Server resources"
            df -h . || true
            free -m || true

            # Stop the app and anything an interrupted deploy left running, to free memory for the build
            pm2 stop offer-dakhlaclub || true
            pkill -f "$PWD/node_modules/" || true
            rm -f .git/index.lock

            # Server pulls from GitHub using its own deploy key.
            # Each build rewrites the sitemap and robots.txt (next-sitemap): drop the server's copies first,
            # or git refuses to pull a commit that changes them and the old code gets rebuilt.
            echo "==> $(date +%T) git pull"
            git checkout -- public/sitemap.xml public/sitemap-0.xml public/robots.txt 2>/dev/null || true
            if ! git pull origin main; then
              echo "==> git pull failed: local changes on the server? Restarting the current version."
              git status --short || true
              pm2 restart offer-dakhlaclub || true
              exit 1
            fi
            git log -1 --oneline

            # Install dependencies
            echo "==> $(date +%T) npm ci"
            npm ci --prefer-offline || npm ci

            # Build the Next.js app
            echo "==> $(date +%T) build"
            timeout 900 npm run build
            BUILD_STATUS=$?
            echo "==> $(date +%T) build exit code: $BUILD_STATUS"

            # Restart or start with PM2
            if command -v pm2 >/dev/null 2>&1; then
              pm2 restart offer-dakhlaclub || pm2 start npm --name "offer-dakhlaclub" -- start
            else
              npm install -g pm2
              pm2 start npm --name "offer-dakhlaclub" -- start
            fi

            pm2 save || true
            echo "==> Deployment done!"
            exit $BUILD_STATUS

      - name: Deployment success
        if: success()
        run: echo "Deployment completed successfully!"

      - name: Deployment failed
        if: failure()
        run: echo "Deployment FAILED! Check the logs above."
